name: CI — Dev Branch

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  ci-frontend:
    name: Frontend — Install, Build, Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync assets
        run: npm run assets:sync

      # Uncomment when ESLint/Prettier is configured:
      # - name: Lint frontend
      #   run: npx eslint apps/web/src packages/*/src --ext .js,.jsx,.ts,.tsx

      - name: Build frontend
        env:
          # Use placeholder URL for CI build validation
          PUBLIC_API_BASE_URL: "https://placeholder.azurecontainerapps.io"
          PUBLIC_MAPTILER_API_KEY: "ci-placeholder"
        run: npm run build

  ci-backend:
    name: Backend — Install, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      # Uncomment when Ruff is added to requirements.txt:
      # - name: Lint backend
      #   run: ruff check apps/api/

      # Uncomment when tests exist:
      # - name: Run tests
      #   run: pytest apps/api/ -v

      - name: Validate Docker build
        run: docker build -t hwc-photo-log-api:ci-test apps/api
