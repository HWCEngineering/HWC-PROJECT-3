name: Deploy Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CONTAINER_APP_ENV: LiDAR-CONTAINER
  LOCATION: eastus2

jobs:
  # ─────────────────────────────────────────────────────────────
  # Build the shared API image once (same code for all projects)
  # ─────────────────────────────────────────────────────────────
  build-api-image:
    name: Build API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, tag with a generic name. Each deploy job re-tags for its container app.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/hwc-photo-log-api:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/hwc-photo-log-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Deploy API — photo-log
  # ─────────────────────────────────────────────────────────────
  deploy-api-photo-log:
    name: Deploy API — photo-log
    runs-on: ubuntu-latest
    needs: build-api-image
    environment: photo-log
    outputs:
      api_url: ${{ steps.capture-url.outputs.api_url }}

    steps:
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container App
        run: |
          CONTAINER_NAME="${{ vars.NAME }}-api"
          IMAGE="ghcr.io/${{ env.OWNER_LC }}/hwc-photo-log-api:${{ github.sha }}"

          if az containerapp show \
            --name "$CONTAINER_NAME" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1; then

            az containerapp registry set \
              --name "$CONTAINER_NAME" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --server ghcr.io \
              --username "${{ env.OWNER_LC }}" \
              --password "${{ secrets.GHCR_READ_TOKEN }}"

            az containerapp update \
              --name "$CONTAINER_NAME" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE" \
              --set-env-vars \
                PORT=8000 \
                MONGO_CONNECTION_STRING="${{ secrets.MONGO_CONNECTION_STRING }}" \
                MONGO_COLLECTION_NAME="${{ vars.NAME }}" \
                AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_CONNECTION_STRING }}" \
                AZURE_STORAGE_CONTAINER_NAME="${{ vars.NAME }}"
          else
            az containerapp create \
              --name "$CONTAINER_NAME" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ env.CONTAINER_APP_ENV }}" \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 3 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --registry-server ghcr.io \
              --registry-username "${{ env.OWNER_LC }}" \
              --registry-password "${{ secrets.GHCR_READ_TOKEN }}" \
              --env-vars \
                PORT=8000 \
                MONGO_CONNECTION_STRING="${{ secrets.MONGO_CONNECTION_STRING }}" \
                MONGO_COLLECTION_NAME="${{ vars.NAME }}" \
                AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_CONNECTION_STRING }}" \
                AZURE_STORAGE_CONTAINER_NAME="${{ vars.NAME }}"
          fi

      - name: Capture API URL
        id: capture-url
        run: |
          CONTAINER_NAME="${{ vars.NAME }}-api"
          API_FQDN=$(az containerapp show \
            --name "$CONTAINER_NAME" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          if [ -z "$API_FQDN" ]; then
            echo "ERROR: Could not determine API FQDN"
            exit 1
          fi

          echo "api_url=https://$API_FQDN" >> "$GITHUB_OUTPUT"
          echo "✅ $CONTAINER_NAME → https://$API_FQDN"

  # ─────────────────────────────────────────────────────────────
  # Deploy API — crawfordsville-market
  # ─────────────────────────────────────────────────────────────
  deploy-api-crawfordsville:
    name: Deploy API — crawfordsville-market
    runs-on: ubuntu-latest
    needs: build-api-image
    environment: crawfordsville-market
    outputs:
      api_url: ${{ steps.capture-url.outputs.api_url }}

    steps:
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container App
        run: |
          CONTAINER_NAME="${{ vars.NAME }}-api"
          IMAGE="ghcr.io/${{ env.OWNER_LC }}/hwc-photo-log-api:${{ github.sha }}"

          if az containerapp show \
            --name "$CONTAINER_NAME" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1; then

            az containerapp registry set \
              --name "$CONTAINER_NAME" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --server ghcr.io \
              --username "${{ env.OWNER_LC }}" \
              --password "${{ secrets.GHCR_READ_TOKEN }}"

            az containerapp update \
              --name "$CONTAINER_NAME" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE" \
              --set-env-vars \
                PORT=8000 \
                MONGO_CONNECTION_STRING="${{ secrets.MONGO_CONNECTION_STRING }}" \
                MONGO_COLLECTION_NAME="${{ vars.NAME }}" \
                AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_CONNECTION_STRING }}" \
                AZURE_STORAGE_CONTAINER_NAME="${{ vars.NAME }}"
          else
            az containerapp create \
              --name "$CONTAINER_NAME" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ env.CONTAINER_APP_ENV }}" \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 3 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --registry-server ghcr.io \
              --registry-username "${{ env.OWNER_LC }}" \
              --registry-password "${{ secrets.GHCR_READ_TOKEN }}" \
              --env-vars \
                PORT=8000 \
                MONGO_CONNECTION_STRING="${{ secrets.MONGO_CONNECTION_STRING }}" \
                MONGO_COLLECTION_NAME="${{ vars.NAME }}" \
                AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_CONNECTION_STRING }}" \
                AZURE_STORAGE_CONTAINER_NAME="${{ vars.NAME }}"
          fi

      - name: Capture API URL
        id: capture-url
        run: |
          CONTAINER_NAME="${{ vars.NAME }}-api"
          API_FQDN=$(az containerapp show \
            --name "$CONTAINER_NAME" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          if [ -z "$API_FQDN" ]; then
            echo "ERROR: Could not determine API FQDN"
            exit 1
          fi

          echo "api_url=https://$API_FQDN" >> "$GITHUB_OUTPUT"
          echo "✅ $CONTAINER_NAME → https://$API_FQDN"

  # ─────────────────────────────────────────────────────────────
  # Deploy Frontend — photo-log
  # ─────────────────────────────────────────────────────────────
  deploy-frontend-photo-log:
    name: Deploy Frontend — photo-log
    runs-on: ubuntu-latest
    needs: deploy-api-photo-log
    environment: photo-log

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync assets
        run: npm run assets:sync

      - name: Build frontend
        env:
          PUBLIC_API_BASE_URL: ${{ needs.deploy-api-photo-log.outputs.api_url }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
          PUBLIC_SITE_TITLE: ${{ vars.PUBLIC_SITE_TITLE }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "apps/web"
          output_location: "dist"

  # ─────────────────────────────────────────────────────────────
  # Deploy Frontend — crawfordsville-market
  # ─────────────────────────────────────────────────────────────
  deploy-frontend-crawfordsville:
    name: Deploy Frontend — crawfordsville-market
    runs-on: ubuntu-latest
    needs: deploy-api-crawfordsville
    environment: crawfordsville-market

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync assets
        run: npm run assets:sync

      - name: Build frontend
        env:
          PUBLIC_API_BASE_URL: ${{ needs.deploy-api-crawfordsville.outputs.api_url }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
          PUBLIC_SITE_TITLE: ${{ vars.PUBLIC_SITE_TITLE }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "apps/web"
          output_location: "dist"
